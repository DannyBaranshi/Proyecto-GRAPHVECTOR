<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Login - Movimiento de Proyectil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <style>
        body {
            min-height: 100vh;
            background: url('https://wallpapers.com/images/hd/dark-elegant-pattern-y67f2aqpg0m7abe1.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .bg-dark-blur-login {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 18px;
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.685);
        }
        label,
        .form-label,
        .form-control,
        .btn {
            color: #fff !important;
        }
        .form-control {
            background: #444 !important;
            border: 1px solid #ccc !important;
            color: #fff !important;
        }
        .form-control::placeholder {
            color: #bbb !important;
        }
        .btn-primary {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }
    </style>
</head>
<body class="text-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-4">
        <div class="bg-dark-blur-login p-4">
            <h2 class="mb-3 text-center">Iniciar sesión</h2>
            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="tucorreo@ejemplo.com"
                        required
                    />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    />
                </div>
                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="remember"
                    />
                    <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
                <div class="mt-3 text-center">
                    <span class="text-light">¿No tienes cuenta?</span>
                    <a 
                        href="/grafico/registro/" 
                        class="link-info fw-bold ms-1" 
                        style="text-decoration: none;"
                    >
                        Registrarse
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
// 1. Usamos la misma URL base que ya te funciona
const API_BASE_URL = 'http://localhost:5278';

async function cargarUsuarios() {
    const tbody = document.getElementById('tabla-usuarios');
    
    try {
        console.log('Intentando conectar a:', `${API_BASE_URL}/api/User/Lista`);
        
        // 2. Consumimos el endpoint GET de tu UserController
        const response = await fetch(`${API_BASE_URL}/api/User/Lista`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        });
        
        console.log('Status Lista:', response.status);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const usuarios = await response.json();
        console.log('Respuesta Usuarios:', usuarios);
        
        tbody.innerHTML = ''; // Limpiamos el indicador de carga
        
        // 3. Validamos si la lista llegó vacía
        if (!usuarios || usuarios.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox fs-3"></i>
                        <p class="mt-2 mb-0">No hay usuarios registrados</p>
                    </td>
                </tr>`;
            return;
        }
        
        // 4. Renderizamos los usuarios mapeando las propiedades del JSON
        usuarios.forEach(usuario => {
            // Nota: C# serializa a JSON en formato camelCase por defecto (primera letra minúscula)
            const nombre = usuario.nombre || usuario.userName || 'Sin Nombre';
            const correo = usuario.email || usuario.correo || '-';
            const id = usuario.idUsuario || usuario.id;

            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>
                    <strong>${nombre}</strong>
                    <span class="badge badge-user ms-1">User</span>
                </td>
                <td>${correo}</td>
                <td>
                    <i class="bi bi-check-circle-fill text-success"></i> Activo
                </td>
                <td>
                    <button onclick="editarUsuario(${id})" class="btn btn-warning btn-sm btn-sm-mobile">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button onclick="eliminarUsuario(${id})" class="btn btn-danger btn-sm btn-sm-mobile">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(fila);
        });
        
    } catch (error) {
        console.error('Error completo en Lista:', error);
        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="text-center py-4 text-danger">
                    <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                    <p class="mt-2 mb-0">Error de conexión: ${error.message}</p>
                    <small class="text-muted">Verifica que la API en el puerto 5278 esté corriendo y tenga CORS habilitado.</small>
                </td>
            </tr>`;
    }
}

// Ejecutar automáticamente al cargar la página
document.addEventListener('DOMContentLoaded', cargarUsuarios);
</script>



</body>
</html>
