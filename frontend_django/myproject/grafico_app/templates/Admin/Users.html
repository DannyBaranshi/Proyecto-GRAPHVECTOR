<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: url('https://wallpapers.com/images/hd/dark-elegant-pattern-y67f2aqpg0m7abe1.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .bg-dark-blur {
            background: rgba(0, 0, 0, 0.466);
            border-radius: 18px;
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.685);
        }

        .table-dark-custom {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
        }

        .table-dark-custom th {
            background: #222 !important;
            color: #17a2b8 !important;
            font-weight: 600;
            border-bottom: 2px solid #17a2b8;
        }

        .table-dark-custom td {
            color: #e2e6ea !important;
            background: rgba(34, 34, 34, 0.8) !important;
            vertical-align: middle;
        }

        .badge-user {
            background: #6c757d;
            color: #fff;
        }

        @media (max-width: 600px) {
            .table-responsive { font-size: 0.85rem; }
            .btn-sm-mobile { padding: 0.25rem 0.5rem; font-size: 0.85rem; }
        }
    </style>
</head>

<body>
<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-12 col-md-12">
            <div class="bg-dark-blur p-4">

                <h2 class="text-center mb-3">👥 Administración de Usuarios</h2>

                <div class="table-responsive">
                    <table class="table table-dark-custom mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo</th>
                                <th>Institución</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border text-info spinner-border-sm" role="status"></div>
                                    <span class="ms-2">Cargando usuarios desde la API...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark-blur border-secondary text-white" style="backdrop-filter: blur(8px); background: rgba(20, 20, 20, 0.85);">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square text-warning me-2"></i> Editar Usuario
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                
                <div class="mb-3">
                    <label class="form-label text-info">Nombre</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="edit-nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-info">Apellido</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="edit-apellido" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-info">Correo Electrónico</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" id="edit-correo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-info">Institución Educativa</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="edit-institucion">
                </div>
            </div>
            <div class="modal-footer border-top border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="border-radius: 10px;">Cancelar</button>
                <button type="button" id="btn-guardar-cambios" onclick="guardarCambiosUsuario()" class="btn btn-warning text-dark fw-bold" style="border-radius: 10px;">
                    <i class="bi bi-floppy-fill me-1"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const API_BASE_URL = 'http://localhost:5278';

    async function cargarUsuarios() {
        const tbody = document.getElementById('tabla-usuarios');
        
        try {
            console.log('Intentando conectar a:', `${API_BASE_URL}/GetUsers`);
            
            const response = await fetch(`${API_BASE_URL}/GetUsers`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            
            console.log('Status API:', response.status);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const usuarios = await response.json();
            console.log('Datos recibidos de Usuarios:', usuarios);
            
            tbody.innerHTML = ''; 
            if (!usuarios || usuarios.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-3"></i>
                            <p class="mt-2 mb-0">No hay usuarios registrados en el sistema.</p>
                        </td>
                    </tr>`;
                return;
            }

            usuarios.forEach(usuario => {
                const id = usuario.id;
                const nombre = usuario.nombre || 'Sin Nombre';
                const apellidos = usuario.apellidos || '-';
                const correo = usuario.correo || '-';   
                const institucion = usuario.institucionEducativa || '-';

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>
                        <strong>${nombre}</strong>
                    </td>
                    <td>${apellidos}</td>
                    <td>${correo}</td>
                    <td>${institucion}</td>
                    <td>
                        <button onclick="editarUsuario(${id})" class="btn btn-warning btn-sm btn-sm-mobile">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button onclick="eliminarUsuario(${id})" class="btn btn-danger btn-sm btn-sm-mobile">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(fila);
            });

        } catch (error) {
            console.error("Error detallado en la consulta:", error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                        <p class="mt-2 mb-0">Error de conexión con la API: ${error.message}</p>
                        <small class="text-muted">Asegúrate de que la API en C# esté corriendo y tenga el CORS debidamente configurado.</small>
                    </td>
                </tr>`;
        }
    }


    document.addEventListener('DOMContentLoaded', cargarUsuarios);

    async function eliminarUsuario(id) {
  
        const confirmar = confirm(`¿Estás seguro de que deseas eliminar al usuario con ID: ${id}?`);
        if (!confirmar) return;

        try {

            const urlDelete = `${API_BASE_URL}/DeleteUser/${id}`;
            console.log('Disparando DELETE a:', urlDelete);

            const response = await fetch(urlDelete, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });

            console.log('Status DELETE:', response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            console.log('Respuesta de eliminación:', data);

            if (data.isSuccess) {
                alert('Usuario eliminado con éxito.');
  
                await cargarUsuarios(); 
            } else {
                alert(`No se pudo eliminar: ${data.mensaje}`);
            }

        } catch (error) {
            console.error('Error completo al eliminar:', error);
            alert(`Error de conexión al intentar eliminar: ${error.message}\nVerifica la consola para más detalles.`);
        }
    }
    let bootstrapEditModalInstance = null;

    async function editarUsuario(id) {
        try {
   
            const urlGetSingle = `${API_BASE_URL}/GetUsers`; 
            const response = await fetch(urlGetSingle);
            if (!response.ok) throw new Error("No se pudo obtener la lista.");
            
            const usuarios = await response.json();
            const usuario = usuarios.find(u => u.id === id);

            if (!usuario) {
                alert("No se encontraron los datos del usuario.");
                return;
            }

            document.getElementById('edit-id').value = usuario.id;
            document.getElementById('edit-nombre').value = usuario.nombre || '';
            document.getElementById('edit-apellido').value = usuario.apellidos || '';
            document.getElementById('edit-correo').value = usuario.correo || '';
            document.getElementById('edit-institucion').value = usuario.institucionEducativa || '';

            if (!bootstrapEditModalInstance) {
                bootstrapEditModalInstance = new bootstrap.Modal(document.getElementById('modalEditarUsuario'));
            }
            bootstrapEditModalInstance.show();

        } catch (error) {
            alert(`Error al cargar los datos del usuario: ${error.message}`);
        }
    }

    async function guardarCambiosUsuario() {
        const id = document.getElementById('edit-id').value;
        const btnGuardar = document.getElementById('btn-guardar-cambios');

        const usuarioActualizado = {
            nombre: document.getElementById('edit-nombre').value,
            apellidos: document.getElementById('edit-apellido').value,
            correo: document.getElementById('edit-correo').value,
            institucionEducativa: document.getElementById('edit-institucion').value
        };

        btnGuardar.disabled = true;

        try {
            const urlUpdate = `${API_BASE_URL}/UpdateUser/${id}`;
            
            const response = await fetch(urlUpdate, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(usuarioActualizado)
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            if (data.isSuccess) {
                bootstrapEditModalInstance.hide(); 
                await cargarUsuarios(); 
            } else {
                alert(`Error: ${data.mensaje}`);
            }
        } catch (error) {
            alert(`Error de conexión al intentar actualizar: ${error.message}`);
        } finally {
            btnGuardar.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        cargarUsuarios();
        
        document.getElementById('btn-confirmar-eliminar-real').addEventListener('click', ejecutarEliminacionReal);
        
        document.getElementById('btn-guardar-cambios').addEventListener('click', guardarCambiosUsuario);
    });
</script>
</body>
</html>
